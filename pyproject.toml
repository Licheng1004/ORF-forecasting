[project]
name = "orf-forecasting"
version = "1.0.0"
description = "Reproducible ORF-forecasting portfolio project by Licheng Xiong"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "pandas==3.0.1",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "ipykernel==7.4.0",
  "nbconvert==7.17.2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[tool.uv]
package = false
